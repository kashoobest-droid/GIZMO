[program:laravel-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /home/forge/your-app-path/artisan queue:work redis --sleep=3 --tries=3 --timeout=90 --memory=128
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/laravel-queue.log
stopwaitsecs=3600
